name: Prezzi giornalieri

# Downloads the Cardmarket price guide every day and publishes prices.json on GitHub Pages,
# together with meta-decks.json (decklists of the official "Top Decks" articles).
# Cardmarket regenerates its files around 01:00 UTC; running at 03:41 UTC leaves margin.
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'website/**', '.github/workflows/prices.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      # Fails (and publishes nothing) if Cardmarket is unreachable: yesterday's file stays online.
      - name: Scarica i prezzi e crea prices.json
        run: dotnet run --no-build --configuration Release --project src/Runekeep.PriceJob -- site
      # Optional: if Riot's site does not answer, the prices are published anyway and the app keeps its decklists.
      - name: Raccogli le decklist dei tornei e crea meta-decks.json
        continue-on-error: true
        run: dotnet run --no-build --configuration Release --project src/Runekeep.MetaJob -- site
      # Presentation page and privacy policy (website/) published next to prices.json.
      - name: Sito di presentazione
        run: cp -r website/. site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
